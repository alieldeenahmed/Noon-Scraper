name: Daily Crawl

on:
  schedule:
    # 03:00 UTC daily - outside typical peak traffic hours for the site being crawled.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# A manual run started while the scheduled one is still going waits for it instead
# of running alongside. (The crawler also refuses to overlap: it takes a
# one-running-crawl row in the database, so a run that somehow starts anyway exits
# cleanly without crawling.) Never cancelled mid-flight.
concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    # Pinned explicitly rather than ubuntu-latest: Playwright's dependency installer
    # doesn't always support the newest Ubuntu release the moment it ships (hit this
    # locally - see docs/engineering-log.md #4), so this stays on a version known to work.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Defensive: a bare Ubuntu install can be missing libicu, which crashes the
      # .NET runtime at startup (hit this in local WSL setup - see
      # docs/engineering-log.md). Harmless no-op if the runner already has it,
      # since the code already uses CultureInfo.InvariantCulture everywhere.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

    defaults:
      run:
        working-directory: Backend/NoonScraper.Crawler

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build --configuration Release

      # GitHub's Ubuntu runner image already ships Google Chrome and xvfb, and the
      # on-demand workflows have run on exactly that for weeks. The old unconditional
      # "install Playwright system dependencies" step downloads ~200 packages and hung
      # on 2026-10-23 until the job timeout cancelled the whole crawl, so it now only runs
      # if Chrome or xvfb is missing - and with its own timeout, so a stuck install fails
      # fast instead of consuming the job's 20 minutes.
      - name: Check for Chrome and xvfb (install only if missing)
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null && command -v xvfb-run >/dev/null; then
            echo "Using the runner's $(google-chrome --version) and xvfb"
          else
            echo "::warning title=Slow path::Chrome or xvfb missing on the runner; installing them"
            dotnet run --configuration Release -- install chrome
            dotnet run --configuration Release -- install-deps
          fi

      - name: Run crawler
        # Headless Chrome is hard-blocked by the target site's anti-bot protection at
        # the network layer (see docs/engineering-log.md #2) - xvfb-run gives headful
        # Chrome a virtual display on this display-less runner instead.
        run: xvfb-run --auto-servernum dotnet run --configuration Release
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE }}
          # Optional - notifications are silently skipped if unset (see
          # docs/telegram-notifications.md). Env vars work fine with "__" here,
          # unlike Back4app, so no flat-name fallback needed in this workflow.
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
