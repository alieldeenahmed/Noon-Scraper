name: CI

# The other workflows in this repo (daily-crawl, check-now, crawl-product) are
# scraping jobs, not quality gates. This is the one that builds and tests the
# code itself on every push and pull request.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Backend

    # The integration tests run against real PostgreSQL - the same engine as
    # production - because they exercise unique and partial indexes, advisory locks,
    # foreign keys and real transactions, none of which an in-memory fake enforces.
    # Locally the tests start an embedded Postgres by themselves; here they use this
    # service container instead (each test still gets its own database).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NOON_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=test;Database=postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build NoonScraper.sln --configuration Release

      # The scraper tests drive a real (headless) Chrome against saved noon.com
      # markup, using the Chrome that ships on GitHub's Ubuntu runners - this
      # prints the version so a missing browser is obvious in the log.
      - name: Show Chrome version
        run: google-chrome --version

      # The API integration tests boot the real ASP.NET Core pipeline against the
      # Postgres service above; no secrets are needed.
      - name: Test
        run: dotnet test NoonScraper.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Component and API-client tests, including the contract test that parses the
      # JSON fixtures the backend's ContractTests pin down.
      - name: Test
        run: npm test

      # Runs `tsc -b` first, so this is also the type-check.
      - name: Build
        run: npm run build
