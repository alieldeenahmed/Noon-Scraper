name: Check Now

# Triggered by the API's POST /api/products/{id}/check-now, via a
# repository_dispatch call (see NoonScraper.Api/Services/GitHubDispatchService.cs).
# The API has no browser available to it, so this workflow is what actually
# performs the on-demand cross-merchant scrape - same reasoning as the daily
# crawl, just triggered per-request instead of on a schedule.
on:
  repository_dispatch:
    types: [check-now]

# What shows in the Actions list. With the request id, product id and correlation
# id right in the run's name, "which run handled request 42?" is a search box away,
# and the same ids are on every log line the crawler prints.
run-name: Check now - request ${{ github.event.client_payload.requestId }}, product ${{ github.event.client_payload.productId }}, ${{ github.event.client_payload.correlationId }}

# One run per product at a time. The API already allows only one active request per
# product, so this is a second line of defence against a re-delivered dispatch.
# Runs are never cancelled mid-flight (that would strand a half-done scrape); a run
# still queued behind another is what would be replaced, and the request it
# belonged to is closed by the API's stale-request expiry.
concurrency:
  group: check-now-${{ github.event.client_payload.productId }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

    defaults:
      run:
        working-directory: Backend/NoonScraper.Crawler

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chrome-1.55.0

      - name: Build
        run: dotnet build --configuration Release

      - name: Install Chrome for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: dotnet run --configuration Release -- install chrome

      - name: Install Playwright system dependencies
        run: dotnet run --configuration Release -- install-deps

      # The id comes in through the environment and is checked before use, rather than
      # being spliced into the shell command, so a malformed dispatch payload can't
      # become a command.
      - name: Validate the request id
        env:
          REQUEST_ID: ${{ github.event.client_payload.requestId }}
        run: |
          if ! [[ "$REQUEST_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Bad dispatch payload::client_payload.requestId is missing or not a number"
            exit 1
          fi

      - name: Run check-now
        env:
          REQUEST_ID: ${{ github.event.client_payload.requestId }}
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE }}
        run: xvfb-run --auto-servernum dotnet run --configuration Release --no-build -- check-now "$REQUEST_ID"

      # If the run died before the crawler could report (Chrome failed to install, the
      # runner was cancelled, the build broke), the request would otherwise stay
      # Pending until the API's stale-request expiry noticed. This closes it now.
      # A request the crawler already closed is left alone.
      - name: Close the request if the run failed
        if: failure() || cancelled()
        env:
          REQUEST_ID: ${{ github.event.client_payload.requestId }}
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE }}
        run: >
          dotnet run --configuration Release --no-build --
          fail-request check-now "$REQUEST_ID"
          "The workflow run failed before the crawler reported a result."
