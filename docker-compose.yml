# Local development stack. Nothing here is a production setup: the database
# password is a dev-only default, the port is bound to localhost only, and the API
# runs in the Development environment (which trusts any localhost origin for CORS).
#
#   docker compose up -d db                  # just PostgreSQL (data in a named volume)
#   docker compose --profile app up --build  # PostgreSQL + migrate/seed + the API
#
# Seeding loads SYNTHETIC demo data (see Backend/NoonScraper.DemoData). Nothing is scraped.
# The crawler itself is not part of this stack: it needs a real, headful Chrome on a
# display, so it runs from GitHub Actions or a local Linux/WSL session.
name: noon-scraper

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noonscraper}
      POSTGRES_USER: ${POSTGRES_USER:-noon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noon_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - noon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies the migrations and loads the synthetic demo data, then exits.
  # Refuses to run if the database already contains real products.
  seed:
    profiles: ["app"]
    build:
      context: ./Backend
      dockerfile: Dockerfile.demo
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-noonscraper};Username=${POSTGRES_USER:-noon};Password=${POSTGRES_PASSWORD:-noon_dev_only}
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ./Backend
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: "8080"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-noonscraper};Username=${POSTGRES_USER:-noon};Password=${POSTGRES_PASSWORD:-noon_dev_only}
      # Left empty on purpose: without a GitHub token the API still works, but
      # "crawl this product" requests are recorded as failed at stage "dispatch".
      GitHubDispatch__Token: ${GITHUB_DISPATCH_TOKEN:-}
    ports:
      - "127.0.0.1:5176:8080"

volumes:
  noon_pgdata:
